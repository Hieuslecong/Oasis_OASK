name: OASIS-A2S mechanical verification

on:
  push:
    branches: ["feat/oasis-a2s-v0.1"]
  pull_request:
    branches: ["feat/oasis-rc-v2.1-dev3-q1"]

jobs:
  mechanical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall src tests
      - run: pytest -q tests/test_a2s.py
      - name: Build exact source archive
        run: git archive --format=zip --output=OASIS_A2S_v0.1.1_exact.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: OASIS_A2S_v0.1.1_exact
          path: OASIS_A2S_v0.1.1_exact.zip
          if-no-files-found: error
