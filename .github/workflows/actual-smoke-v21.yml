name: OASIS-RC-v2.1 Actual Smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'protocols/**'
      - 'METHOD_SPEC_V2_1.md'
      - 'pyproject.toml'
      - 'requirements-tested.txt'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: actual-v21-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tested.txt
          python -m pip install -e . --no-deps
      - name: Compile actual smoke harness
        run: python -m py_compile scripts/run_actual_smoke_v21.py
      - name: Actual CLI smoke N0 and N25, all six arms
        run: |
          python scripts/run_actual_smoke_v21.py \
            --out actual_smoke_v21 \
            --critic-epochs 24 \
            --student-epochs 2 \
            --image-size 64 \
            --train-samples 48 \
            --val-samples 24 \
            --holdout-samples 8 \
            --normal-train-samples 24 \
            --normal-val-samples 16
      - name: Assert smoke summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('actual_smoke_v21/ACTUAL_SMOKE_SUMMARY.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS', r
          assert r['kind']=='actual-cli-integration-smoke-dev2'
          assert r['implementation']=='OASIS-RC-v2.1-dev2'
          assert r['canonical_test_opened'] is False
          assert r['canonical_test_created'] is False
          assert r['synthetic_smoke_holdout_evaluated'] is False
          assert set(r['protocols']) == {'N0','N25'}
          expected={'B0','B1','B2','S1','S2','S3'}
          for protocol in ('N0','N25'):
              x=r['protocols'][protocol]
              assert x['critic_qualification']['pass'] is True
              assert set(x['arms']) == expected
              for arm in expected:
                  for key in ('dice','iou','threshold'):
                      assert isinstance(x['arms'][arm][key], (int,float))
          assert r['protocols']['N25']['critic_qualification']['normal_split']=='normal_val'
          print(json.dumps(r, indent=2))
          PY
      - name: Upload actual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-smoke-v21-dev2-${{ github.run_attempt }}
          path: actual_smoke_v21/
          if-no-files-found: warn
          retention-days: 14
