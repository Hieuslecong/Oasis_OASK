name: OASIS-RC-v2 CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: oasis-rc-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tested.txt
          python -m pip install -e . --no-deps
      - name: Compile all production and test Python
        run: python -m compileall src scripts tests
      - name: Behavioural tests including v2.1 smoke and dev2 hardening
        run: pytest -q -s
      - name: Parse every shell launcher
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
          done
      - name: Version and protocol identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from oasis_rc_v2.checkpoint import (
              CHECKPOINT_SCHEMA, IMPLEMENTATION_VERSION, METHOD_VERSION,
          )
          protocol=json.loads(Path('protocols/real_data_v21.json').read_text())
          assert METHOD_VERSION == 'OASIS-RC-v2.1'
          assert IMPLEMENTATION_VERSION == '2.1.0-dev2'
          assert CHECKPOINT_SCHEMA == 5
          assert protocol['implementation_version'] == IMPLEMENTATION_VERSION
          assert protocol['checkpoint_schema'] == CHECKPOINT_SCHEMA
          assert protocol['final_test']['required_arms'] == ['B0','B1','B2','S1','S2','S3']
          assert protocol['final_test']['canonical_splits'] == ['test','normal_test']
          assert protocol['aosk']['variant'] == 'structure-tensor-steered-v2'
          print('V21_DEV2_IDENTITY=PASS')
          PY
      - name: Production launcher contract
        run: |
          set -euo pipefail
          test -f METHOD_SPEC_V2_1.md
          test -f scripts/preflight_v21_real_gpu.py
          test -f scripts/prepare_real_data_v21.sh
          test -f scripts/run_training_ready_v21.sh
          python - <<'PY'
          from pathlib import Path
          for path in ('scripts/run_training_ready_v21.sh','scripts/run_validation_arms_v21.sh'):
              text=Path(path).read_text()
              assert 'train_oasis_rc_v21' in text, path
              assert 'train_oasis_rc_v2 ' not in text, path
          print('V21_ONLY_LAUNCHERS=PASS')
          PY
