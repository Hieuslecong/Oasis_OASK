name: OASIS-RC-v2 CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: oasis-rc-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tested.txt
          python -m pip install -e . --no-deps
      - name: Compile
        run: python -m compileall src scripts tests
      - name: Test
        run: pytest -q
      - name: Shell syntax
        run: |
          bash -n scripts/run_smoke.sh
          bash -n scripts/run_full_smoke_train_test.sh
          bash -n scripts/run_lightweight_smoke.sh
          bash -n scripts/run_three_seeds.sh
          bash -n scripts/evaluate_checkpoint.sh
          bash -n scripts/run_validation_arms.sh
          bash -n scripts/run_validation_eval.sh
          bash -n scripts/prepare_n0_data.sh
          bash -n scripts/prepare_real_data.sh
          bash -n scripts/run_training_ready.sh
          bash -n scripts/run_all_seeds.sh
          bash -n scripts/run_final_test.sh
      - name: Canonical method contract
        run: |
          grep -q 'AOSK_VARIANT = "oriented-consistency-v1"' src/oasis_cycle_aosk/train_oasis_rc_v2.py
          grep -q 'AOSK_DEFAULT_VARIANT = AOSK_ORIENTED_VARIANT' src/oasis_cycle_aosk/aosk_dispatch.py
          ! grep -E 'aosk_topology|centerline-cldice-v1' \
            scripts/run_smoke.sh \
            scripts/run_full_smoke_train_test.sh \
            scripts/run_validation_arms.sh \
            scripts/run_validation_eval.sh
          grep -q 'prepare_n0_data.sh' scripts/run_training_ready.sh
          grep -q 'DEPRECATED' scripts/run_three_seeds.sh
