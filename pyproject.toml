[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oasis-a2s-crack-segmentation"
version = "0.1.1"
description = "OASIS-A2S semantic-adversarial pretraining and discriminator-to-segmenter transfer for crack segmentation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
